<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>It's 30th August! 🎉</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3
            );

            color: white;
        }

        .card {
            text-align: center;

            padding: 60px 40px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.2);

            backdrop-filter: blur(10px);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 50px;

            margin-bottom: 20px;
        }

        p {
            font-size: 20px;

            margin-bottom: 35px;
        }

        .link-button {
            display: inline-block;

            padding: 15px 35px;

            border-radius: 50px;

            background: white;

            color: #ff4f81;

            text-decoration: none;

            font-size: 20px;

            font-weight: bold;

            transition: 0.3s;
        }

        .link-button:hover {
            transform: scale(1.08);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.2);
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>🎉 It's 30th August! 🎉</h1>

        <p>
            The countdown is over!
        </p>

        <!-- Birthday Website Link -->
        <a
            href="https://nitilikesbrownie.github.io/Birthday/"
            class="link-button">
            Open the Link 🔗
        </a>

    </div>

</body>

</html>
